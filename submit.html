<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Submit a Mystery | Bonded in Mystery</title><link rel="stylesheet" href="assets/css/style.css"></head><body><div id="site-header"></div><main class="page wrap narrow"><p class="eyebrow">YOUR LEAD / OUR NEXT INVESTIGATION</p><h1>SUBMIT A <em>MYSTERY</em></h1><p class="lead">Know a strange story, unresolved question or local mystery? Tell us where to begin.</p><form id="mystery-form" class="mystery-form"><label>Your name<input name="name" required maxlength="100" placeholder="Name or nickname"></label><label>Email (optional)<input name="email" type="email" maxlength="200" placeholder="you@example.com"></label><label>What kind of mystery?<select name="category" required><option value="">Choose a category</option><option>Unsolved / true crime</option><option>Paranormal</option><option>UFO / UAP / beyond earth</option><option>Historical mystery</option><option>Strange facts / unexplained</option><option>Other</option></select></label><label>What should we investigate?<input name="title" required maxlength="180" placeholder="A short title for your lead"></label><label>Tell us what you know<textarea name="details" rows="6" required maxlength="4000" placeholder="Share the story, dates, locations, sources or links that could help us research it."></textarea></label><label>Helpful source link (optional)<input name="source_url" type="url" maxlength="1000" placeholder="https://"></label><label class="checkline"><input type="checkbox" required> I understand this is a suggestion, not a guarantee of coverage. I will not submit private, confidential or unlawfully obtained material.</label><button class="btn btn-red" type="submit">SEND MYSTERY LEAD ↗</button><p class="form-note">Submissions are stored securely for moderator review. They are not published automatically.</p><p id="form-status" role="status"></p></form></main><div id="site-footer"></div><script src="assets/js/config.js"></script><script src="assets/js/app.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script><script>if(window.supabase&&!window.bimSupabase)window.bimSupabase=window.supabase.createClient(window.BIM_CONFIG.supabaseUrl,window.BIM_CONFIG.supabasePublishableKey);</script><script src="assets/js/public-data.js"></script></body></html>
